<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Audio Genre Classifier</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1.5rem;
    color: #1a1a1a;
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  p.subtitle { color: #666; margin-top: 0; }
  .dropzone {
    border: 2px dashed #999;
    border-radius: 12px;
    padding: 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .dropzone.dragover { border-color: #4f46e5; background: #f5f4ff; }
  .dropzone input { display: none; }
  #filename { margin-top: 0.75rem; font-size: 0.9rem; color: #444; }
  button {
    margin-top: 1.25rem;
    width: 100%;
    padding: 0.75rem;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: white;
    cursor: pointer;
  }
  button:disabled { background: #b3b0e6; cursor: not-allowed; }
  #results { margin-top: 2rem; }
  .bar-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; }
  .bar-label { width: 90px; font-size: 0.9rem; text-align: right; text-transform: capitalize; }
  .bar-track { flex: 1; background: #eee; border-radius: 6px; overflow: hidden; height: 20px; }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #4f46e5, #818cf8);
    transition: width 0.4s ease;
  }
  .bar-pct { width: 48px; font-size: 0.85rem; color: #444; }
  #error { color: #b91c1c; margin-top: 1rem; display: none; }
  #status { color: #666; margin-top: 1rem; display: none; }
</style>
</head>
<body>
  <h1>Audio Genre Classifier</h1>
  <p class="subtitle">Upload a song and see the model's predicted genre breakdown.</p>

  <div class="dropzone" id="dropzone">
    <div>Click to choose a file, or drag one here</div>
    <div id="filename">No file selected</div>
    <input type="file" id="fileInput" accept=".wav,.mp3,.flac,.ogg,.m4a" />
  </div>

  <button id="submitBtn" disabled>Predict Genre</button>
  <div id="status">Running inference...</div>
  <div id="error"></div>
  <div id="results"></div>

  <script>
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const filenameEl = document.getElementById("filename");
    const submitBtn = document.getElementById("submitBtn");
    const resultsEl = document.getElementById("results");
    const errorEl = document.getElementById("error");
    const statusEl = document.getElementById("status");

    let selectedFile = null;

    dropzone.addEventListener("click", () => fileInput.click());

    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener("change", () => {
      if (fileInput.files.length) setFile(fileInput.files[0]);
    });

    function setFile(file) {
      selectedFile = file;
      filenameEl.textContent = file.name;
      submitBtn.disabled = false;
      resultsEl.innerHTML = "";
      errorEl.style.display = "none";
    }

    submitBtn.addEventListener("click", async () => {
      if (!selectedFile) return;

      submitBtn.disabled = true;
      statusEl.style.display = "block";
      errorEl.style.display = "none";
      resultsEl.innerHTML = "";

      const formData = new FormData();
      formData.append("file", selectedFile);

      try {
        const response = await fetch("/predict", { method: "POST", body: formData });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Prediction failed.");
        }

        renderResults(data.predictions);
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      } finally {
        statusEl.style.display = "none";
        submitBtn.disabled = false;
      }
    });

    function renderResults(predictions) {
      resultsEl.innerHTML = "";
      for (const { genre, probability } of predictions) {
        const pct = (probability * 100).toFixed(1);
        const row = document.createElement("div");
        row.className = "bar-row";
        row.innerHTML = `
          <div class="bar-label">${genre}</div>
          <div class="bar-track"><div class="bar-fill" style="width: ${pct}%"></div></div>
          <div class="bar-pct">${pct}%</div>
        `;
        resultsEl.appendChild(row);
      }
    }
  </script>
</body>
</html>
