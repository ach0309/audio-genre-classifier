<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">Audio Genre Classifier Database ERD</title>
  <desc id="desc">Entity relationship diagram showing the labels table connected one-to-many with the audio_clips table.</desc>
  <defs>
    <style>
      .canvas { fill: #f7f7f4; }
      .table { fill: #ffffff; stroke: #242424; stroke-width: 2; }
      .header-labels { fill: #315b5b; }
      .header-clips { fill: #6d4c3d; }
      .header-text { fill: #ffffff; font: 700 22px Arial, sans-serif; }
      .field { fill: #242424; font: 16px Arial, sans-serif; }
      .key { fill: #7b3f00; font: 700 13px Arial, sans-serif; }
      .muted { fill: #5d6466; font: 13px Arial, sans-serif; }
      .line { stroke: #242424; stroke-width: 2.5; fill: none; }
      .crow { stroke: #242424; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .badge { fill: #ece6dc; stroke: #6d4c3d; stroke-width: 1.5; }
      .badge-text { fill: #3b332f; font: 700 13px Arial, sans-serif; }
      .note { fill: #40484a; font: 14px Arial, sans-serif; }
      .rule { stroke: #dedbd4; stroke-width: 1; }
    </style>
  </defs>

  <rect class="canvas" width="1120" height="760"/>

  <text x="80" y="62" fill="#242424" font-family="Arial, sans-serif" font-size="28" font-weight="700">Audio Genre Classifier Database ERD</text>
  <text class="note" x="80" y="88">Based on db/schema.sql</text>

  <g transform="translate(80 160)">
    <rect class="table" width="350" height="300" rx="6"/>
    <rect class="header-labels" width="350" height="64" rx="6"/>
    <path class="header-labels" d="M0 56H350V70H0z"/>
    <text class="header-text" x="26" y="41">labels</text>

    <text class="field" x="26" y="103">label_id</text>
    <text class="key" x="272" y="103">PK</text>
    <text class="muted" x="26" y="125">SERIAL</text>

    <line class="rule" x1="26" y1="150" x2="324" y2="150"/>

    <text class="field" x="26" y="183">label_name</text>
    <text class="key" x="272" y="183">UK</text>
    <text class="muted" x="26" y="205">TEXT, NOT NULL, UNIQUE</text>

    <line class="rule" x1="26" y1="230" x2="324" y2="230"/>

    <text class="field" x="26" y="263">sample_count</text>
    <text class="muted" x="26" y="285">INT, NOT NULL, DEFAULT 0</text>
  </g>

  <g transform="translate(680 120)">
    <rect class="table" width="360" height="540" rx="6"/>
    <rect class="header-clips" width="360" height="64" rx="6"/>
    <path class="header-clips" d="M0 56H360V70H0z"/>
    <text class="header-text" x="26" y="41">audio_clips</text>

    <text class="field" x="26" y="103">id</text>
    <text class="key" x="282" y="103">PK</text>
    <text class="muted" x="26" y="125">SERIAL</text>

    <line class="rule" x1="26" y1="150" x2="334" y2="150"/>

    <text class="field" x="26" y="183">file_path</text>
    <text class="key" x="282" y="183">UK</text>
    <text class="muted" x="26" y="205">TEXT, NOT NULL, UNIQUE</text>

    <line class="rule" x1="26" y1="230" x2="334" y2="230"/>

    <text class="field" x="26" y="263">label_id</text>
    <text class="key" x="282" y="263">FK</text>
    <text class="muted" x="26" y="285">INT, REFERENCES labels(label_id)</text>

    <line class="rule" x1="26" y1="310" x2="334" y2="310"/>

    <text class="field" x="26" y="343">split</text>
    <text class="muted" x="26" y="365">TEXT, CHECK train | val | test</text>

    <line class="rule" x1="26" y1="390" x2="334" y2="390"/>

    <text class="field" x="26" y="423">is_corrupted</text>
    <text class="muted" x="26" y="445">BOOLEAN, NOT NULL, DEFAULT FALSE</text>

    <line class="rule" x1="26" y1="470" x2="334" y2="470" opacity="0"/>
    <text class="field" x="26" y="496">is_duplicate</text>
    <text class="muted" x="26" y="518">BOOLEAN, NOT NULL, DEFAULT FALSE</text>
  </g>

  <path class="line" d="M430 310H680"/>
  <line class="crow" x1="650" y1="310" x2="680" y2="286"/>
  <line class="crow" x1="650" y1="310" x2="680" y2="334"/>
  <line class="crow" x1="650" y1="310" x2="680" y2="310"/>
  <line class="crow" x1="454" y1="286" x2="454" y2="334"/>
  <line class="crow" x1="466" y1="286" x2="466" y2="334"/>

  <rect class="badge" x="504" y="267" width="108" height="86" rx="6"/>
  <text class="badge-text" x="528" y="300">one label</text>
  <text class="badge-text" x="522" y="327">many clips</text>

  <text class="note" x="80" y="520">Each genre label can classify many audio clips.</text>
  <text class="note" x="680" y="700">Training queries filter out rows where</text>
  <text class="note" x="680" y="724">is_corrupted or is_duplicate is TRUE.</text>
</svg>
